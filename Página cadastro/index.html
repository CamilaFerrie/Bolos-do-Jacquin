<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bolos do Jacquin - Página de cadastro</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:ital,wght@0,100..900;1,100..900&family=Libre+Caslon+Text:ital,wght@0,400;0,700;1,400&display=swap"
        rel="stylesheet">
</head>

<body>
    <header class="pagina_cadastro">
        <div class="container_cadastro">
            <div class="logo">
                <img src="../Img/Logo.svg" alt="Logo do Bolos do Jacquin">
            </div>

            <div class="pesquisa">
                <svg xmlns="http://www.w3.org/2000/svg" x="0px" y="0px" viewBox="0 0 30 30">
                    <path
                        d="M 13 3 C 7.4889971 3 3 7.4889971 3 13 C 3 18.511003 7.4889971 23 13 23 C 15.396508 23 17.597385 22.148986 19.322266 20.736328 L 25.292969 26.707031 A 1.0001 1.0001 0 1 0 26.707031 25.292969 L 20.736328 19.322266 C 22.148986 17.597385 23 15.396508 23 13 C 23 7.4889971 18.511003 3 13 3 z M 13 5 C 17.430123 5 21 8.5698774 21 13 C 21 17.430123 17.430123 21 13 21 C 8.5698774 21 5 17.430123 5 13 C 5 8.5698774 8.5698774 5 13 5 z">
                    </path>
                </svg>
                <input type="text" placeholder="Buscar doçuras...">
            </div>

            <a class="pesquisa_inicio" href="">
                Início
                <span>Commencer</span>
                <hr>
            </a>

            <button>
                <svg xmlns="http://www.w3.org/2000/svg"
                    viewBox="0 0 640 640"><!--! Font Awesome Pro 7.3.1 by @fontawesome - https://fontawesome.com License - https://fontawesome.com/license (Commercial License) Copyright 2026 Fonticons, Inc. -->
                    <path fill="currentColor"
                        d="M360 128L116.3 320L544 320C544 192 432 128 360 128zM64 336C64 326.2 68.5 316.9 76.2 310.9L340.2 102.9C345.8 98.5 352.8 96 360 96C404.3 96 457.6 115.2 499.9 151.8C543.1 189.2 576 245.7 576 320L576 480C576 515.3 547.3 544 512 544L128 544C92.7 544 64 515.3 64 480L64 336zM96 416L544 416L544 352L96 352L96 416zM96 448L96 480C96 497.7 110.3 512 128 512L512 512C529.7 512 544 497.7 544 480L544 448L96 448z" />
                </svg>
            </button>
        </div>
    </header>

    <main>
        <h1>Página administrativa -Bolos dos Jacquin</h1>
        <section class="cadastro_produtos">
            <div class="cadastro">
                <div class="imagem_jacquin cad_container">
                    <img src="../Img/Logo Bolos do Jacquin.png  " alt="">
                    <div class="box_texto">
                        <h2>Cadastro de Produtos</h2>
                        <span>Enregistrement du Produit</span>
                        <hr>
                    </div>
                </div>

                <form action="">
                    <div class="inputs_forms">

                        <div class="form_coluna1">
                            <div class="linha_form">
                                <label for="Text">NOME</label>
                                <input placeholder="Ex: Opera Éternelle" type="text" name="" id="">
                            </div>
                            <div class="input_cat">
                                <label for="Text">CADASTRO</label>
                                <input placeholder="Ex: Café, Chocolate, Bolo" type="text" name="" id="">
                            </div>

                            <div class="input_img">
                                <span>IMAGEM</span>
                                <label for="img">
                                    <svg xmlns="http://www.w3.org/2000/svg"
                                        viewBox="0 0 640 640"><!--! Font Awesome Pro 7.3.1 by @fontawesome - https://fontawesome.com License - https://fontawesome.com/license (Commercial License) Copyright 2026 Fonticons, Inc. -->
                                        <path fill="currentColor"
                                            d="M336 118.6L336 400C336 408.8 328.8 416 320 416C311.2 416 304 408.8 304 400L304 118.6L219.3 203.3C213.1 209.5 202.9 209.5 196.7 203.3C190.5 197.1 190.5 186.9 196.7 180.7L308.7 68.7C314.9 62.5 325.1 62.5 331.3 68.7L443.3 180.7C449.5 186.9 449.5 197.1 443.3 203.3C437.1 209.5 426.9 209.5 420.7 203.3L336 118.6zM256 384L160 384C142.3 384 128 398.3 128 416L128 480C128 497.7 142.3 512 160 512L480 512C497.7 512 512 497.7 512 480L512 416C512 398.3 497.7 384 480 384L384 384L384 352L480 352C515.3 352 544 380.7 544 416L544 480C544 515.3 515.3 544 480 544L160 544C124.7 544 96 515.3 96 480L96 416C96 380.7 124.7 352 160 352L256 352L256 384zM416 448C416 434.7 426.7 424 440 424C453.3 424 464 434.7 464 448C464 461.3 453.3 472 440 472C426.7 472 416 461.3 416 448z" />
                                    </svg>
                                </label>
                                <input type="file" name="img" id="">
                            </div>

                            <div class="linha_form2">
                                <label for="Text">DESCRIÇÃO CURTA</label>
                                <textarea name="" id="" cols="30">sda</textarea>
                            </div>
                        </div>

                        <div class="form_coluna2">
                            <div class="linha_form3">
                                <div class="input_valor">
                                    <label for="">VALOR POR QUILO</label>
                                    <input type="text" name="" id="">
                                </div>

                                <div class="input_ativo">
                                    <label for="">ATIVO</label>
                                    <input type="checkbox" name="" id="">
                                </div>
                            </div>

                            <div class="linha_form4">
                                <textarea name="" id="" rows="10">Ex: Um ícone da patisserie francesa, o Gâteau Opéra é uma celebração de texturas e sabores
                            intensos. Composto por camadas finíssimas de biscuit joconde embebido em xarope de café,
                            entrelaçadas com um sedoso creme de manteiga de café e ganache de chocolate belga 70%. Cada
                            fatia é uma viagem sensorial à Belle Époque de Paris.</textarea>
                            </div>

                        </div>

                    </div>
                    <input type="button" value="CADASTRAR">
                </form>
        </section>

    </main>

    <footer>

    </footer>

</body>


</html>
